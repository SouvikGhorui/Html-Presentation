<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRAS G12C Bioinformatics Analysis - BPRI</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Open+Sans:wght@300;400;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="bg-animation" id="bg-anim"></div>
    <div id="presentation">
        <!-- Slides will be loaded dynamically here -->
    </div>

    <div class="controls">
        <div class="control-info">
            <div class="slide-counter"><span id="current-slide">1</span> / 25</div>
            <button id="fullscreen-btn" title="Toggle Fullscreen">⛶</button>
        </div>
        <div class="progress-container">
            <div id="progress"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
